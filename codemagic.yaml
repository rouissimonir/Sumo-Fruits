workflows:
  capacitor-ios:
    name: Sumo Fruits iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: my_asc_key

    environment:
      xcode: "26.6"
      node: "22"
      groups:
        - ios_signing
        - ios_certs
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.mounirrouissi.sumofruits

    cache:
      cache_paths:
        - $HOME/Library/Caches/org.swift.swiftpm
        - $CM_BUILD_DIR/SourcePackages

    scripts:
      - name: Install dependencies
        script: |
          set -e
          npm ci --include=optional
          node -e "for (const packageName of ['@rollup/rollup-darwin-arm64', 'lightningcss-darwin-arm64', '@tailwindcss/oxide-darwin-arm64']) require.resolve(packageName)"

      - name: Verify committed Capacitor iOS project
        script: |
          set -e
          test -f "$CM_BUILD_DIR/package-lock.json"
          test -f "$CM_BUILD_DIR/capacitor.config.ts"
          test -f "$CM_BUILD_DIR/ios/App/App.xcodeproj/project.pbxproj"
          test -f "$CM_BUILD_DIR/ios/App/CapApp-SPM/Package.swift"

      - name: Validate TypeScript
        script: npm run lint

      - name: Run gameplay tests
        script: npm test

      - name: Build web app and sync Capacitor with SPM
        script: |
          set -e
          npm run build
          test -f "$CM_BUILD_DIR/dist/index.html"
          npx cap sync ios

      - name: Fetch and apply App Store signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Set build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          set -e
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "-clonedSourcePackagesDirPath $CM_BUILD_DIR/SourcePackages"

          IPA_PATH="$(find "$CM_BUILD_DIR/build/ios/ipa" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          echo "IPA ready for publishing: $IPA_PATH"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
