workflows:
  godot-ios:
    name: Godot iOS Build

    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest
      vars:
        GODOT_VERSION: "4.3"
        EXPORT_PRESET: "iOS"

    scripts:
      - name: Download Godot
        script: |
          curl -L \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip" \
            -o godot.zip

          unzip -q godot.zip

      - name: Download Godot export templates
        script: |
          curl -L \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -o templates.tpz

          unzip -q templates.tpz

          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"

          mkdir -p "$TEMPLATE_DIR"
          cp -R templates/* "$TEMPLATE_DIR/"

      - name: Select Xcode
        script: |
          sudo xcode-select -switch /Applications/Xcode.app

      - name: Export Godot project for iOS
        script: |
          mkdir -p build

          ./Godot.app/Contents/MacOS/Godot \
            --headless \
            --path godot \
            --export-release "$EXPORT_PRESET" \
            ../build/MyGame.zip

    artifacts:
      - build/*.zip
