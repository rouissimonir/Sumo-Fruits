workflows:
  capacitor-ios:
    name: Capacitor iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      xcode: latest
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install dependencies & Build Web App
        script: |
          npm ci || npm install
          npm run build
      - name: Capacitor Sync
        script: |
          npx cap sync ios || echo "Capacitor iOS sync skipped if ios/ is not generated yet"
      - name: Build iOS Archive / IPA
        script: |
          if [ -d "ios/App" ]; then
            xcode-project build-ipa \
              --workspace "$XCODE_WORKSPACE" \
              --scheme "$XCODE_SCHEME"
          else
            mkdir -p build
            zip -r build/dist-web-package.zip dist/
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - build/*.zip
      - /tmp/xcodebuild_logs/*.log

  capacitor-android:
    name: Capacitor Android Build
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies & Build Web App
        script: |
          npm ci || npm install
          npm run build
      - name: Capacitor Sync
        script: |
          npx cap sync android || echo "Capacitor Android sync skipped if android/ is not generated yet"
      - name: Build Android APK
        script: |
          if [ -d "android" ]; then
            cd android && ./gradlew assembleRelease
          else
            mkdir -p build
            zip -r build/dist-web-package.zip dist/
          fi
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
      - build/*.zip
