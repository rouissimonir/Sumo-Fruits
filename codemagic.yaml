workflows:
  capacitor-ios:
    name: Sumo Fruits iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: "26.0"
      node: "22"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mounirrouissi.sumofruits
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App

    cache:
      cache_paths:
        - $HOME/Library/Caches/org.swift.swiftpm
        - $CM_BUILD_DIR/SourcePackages

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Verify committed Capacitor iOS project
        script: |
          set -e
          test -f "$CM_BUILD_DIR/package-lock.json"
          test -f "$CM_BUILD_DIR/capacitor.config.ts"
          test -f "$CM_BUILD_DIR/ios/App/App.xcodeproj/project.pbxproj"
          test -f "$CM_BUILD_DIR/ios/App/CapApp-SPM/Package.swift"

      - name: Validate TypeScript
        script: npm run lint

      - name: Run gameplay tests
        script: npm test

      - name: Build web app and sync Capacitor with SPM
        script: |
          npm run build
          npx cap sync ios

      - name: Apply App Store signing profiles
        script: xcode-project use-profiles

      - name: Set build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "-clonedSourcePackagesDirPath $CM_BUILD_DIR/SourcePackages"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
